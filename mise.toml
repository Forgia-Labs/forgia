# --- Core tasks ---

[tasks.init]
description = "Forgia il vault .forgia/ nel progetto"
run = "{{source_dir}}/bin/forgia init"

[tasks.status]
description = "Mostra la dashboard FD + SDD"
run = "{{source_dir}}/bin/forgia status"

[tasks.doctor]
description = "Verifica salute: docker, openhands, vault, mise"
run = "{{source_dir}}/bin/forgia doctor"

# --- SDD execution (runner-agnostic) ---

[tasks."sdd:exec"]
description = "Esegui un SDD (auto-detect runner da config.toml)"
usage = "mise run sdd:exec <sdd-file> [--runner=claude|openhands]"
run = "{{source_dir}}/bin/forgia exec $@"

[tasks."sdd:batch"]
description = "Esegui tutti gli SDD di un FD"
usage = "mise run sdd:batch <FD-NNN> [--runner=claude|openhands]"
run = "{{source_dir}}/bin/forgia batch $@"

[tasks."sdd:watch"]
description = "Osserva e esegui nuovi SDD automaticamente"
usage = "mise run sdd:watch <FD-NNN> [--runner=claude|openhands]"
run = "{{source_dir}}/bin/forgia watch $@"

# --- Beads (bd) task tracker ---

[tasks."bd:install"]
description = "Installa Beads (bd) task tracker"
run = """
#!/usr/bin/env bash
set -euo pipefail

if command -v bd >/dev/null 2>&1; then
  echo "✓ bd already installed: $(bd --version 2>/dev/null || echo 'ok')"
  exit 0
fi

if command -v npm >/dev/null 2>&1; then
  echo "→ Installing bd via npm..."
  npm install -g @beads/bd
elif command -v brew >/dev/null 2>&1; then
  echo "→ Installing bd via brew..."
  brew install beads
else
  echo "Error: npm or brew required to install bd" >&2
  exit 1
fi

echo "✓ bd installed"
"""

[tasks."bd:init"]
description = "Inizializza Beads nel progetto"
run = """
#!/usr/bin/env bash
set -euo pipefail

if [[ -d ".beads" ]]; then
  echo "✓ Beads already initialized"
  exit 0
fi

bd init
echo "✓ Beads initialized"
"""

[tasks."bd:ready"]
description = "Mostra task sbloccati e pronti per esecuzione"
run = "bd ready"

[tasks."bd:status"]
description = "Mostra stato completo del task graph"
run = "bd status"

# --- OpenHands tasks ---

[tasks."openhands:install"]
description = "Scarica immagine OpenHands"
run = [
  "docker pull ghcr.io/all-hands-ai/openhands:latest",
  "echo '✓ OpenHands installato. Usa: mise run sdd:exec <file> --runner=openhands'"
]

[tasks."openhands:up"]
description = "Avvia OpenHands UI su :3000"
run = "docker compose -f {{source_dir}}/modules/openhands/docker-compose.yml up -d"
depends = ["openhands:install"]

[tasks."openhands:down"]
description = "Ferma OpenHands"
run = "docker compose -f {{source_dir}}/modules/openhands/docker-compose.yml down"

[tasks."openhands:logs"]
description = "Segui i log di OpenHands"
run = "docker compose -f {{source_dir}}/modules/openhands/docker-compose.yml logs -f"

# --- Claude Code integration ---

[tasks."claude:install"]
description = "Collega i comandi Claude Code in ~/.claude/commands/"
run = """
#!/usr/bin/env bash
set -euo pipefail

COMMANDS_DIR="$HOME/.claude/commands"
mkdir -p "$COMMANDS_DIR"

for cmd_file in {{source_dir}}/modules/claude-commands/*.md; do
  [[ -f "$cmd_file" ]] || continue
  target="$COMMANDS_DIR/$(basename "$cmd_file")"
  ln -sf "$cmd_file" "$target"
  echo "  Linked: /$(basename "$cmd_file" .md)"
done

echo "✓ Comandi Claude Code installati"
"""
